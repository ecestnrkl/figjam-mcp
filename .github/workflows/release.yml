name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that tag, package.json, server.json and CHANGELOG agree
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Audit production and development dependencies
        run: npm run security:check
      - name: Typecheck, test, build, exercise the packed CLI and keep the tested tarball
        run: npm run package:smoke -- --long --artifact-dir "$RUNNER_TEMP/release"
      - name: Use npm 11.5.1 or later for trusted publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)' "$(npm --version)" \
            || npm install --global npm@11.6.2
          npm --version
      - name: Publish the tested tarball to npm with provenance
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping npm publish."
          else
            npm publish "$RUNNER_TEMP"/release/*.tgz --provenance --access public
          fi

  registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # MCP Registry login via GitHub OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the npm registry serves the published version
        env:
          ATTEMPTS: 60
          INTERVAL_SECONDS: 10
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          url="https://registry.npmjs.org/$name/$version"
          # npm's CDN can cache a 404 from before the publish: a new query and no-cache bypass it.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' \
              "$url?attempt=$attempt-$(date +%s)" || true)
            if [ "$status" = "200" ]; then
              echo "$url answered 200 after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt of $ATTEMPTS: $url answered $status; retrying in $INTERVAL_SECONDS s."
            sleep "$INTERVAL_SECONDS"
          done
          echo "::error::$url did not answer 200 within $((ATTEMPTS * INTERVAL_SECONDS)) s ($ATTEMPTS attempts, $INTERVAL_SECONDS s apart)."
          exit 1
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish server.json to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/mcp-publisher" publish; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Publish attempt $attempt failed; retrying in 30 s."
              sleep 30
            fi
          done
          echo "::error::MCP Registry publish failed after 3 attempts."
          exit 1

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-check.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
          name=$(node -p 'require("./package.json").name')
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$name ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
