name: Published package smoke

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/published-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
        include:
          - os: ubuntu-latest
            node-version: '22.12.0'
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Resolve published version
        id: version
        shell: bash
        run: |
          version=$(npm view figjam-context-mcp dist-tags.latest)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ steps.version.outputs.version }}
          persist-credentials: false
      - run: npm ci
      - run: npm run package:smoke
      - name: Summarize published dependencies
        if: always() && steps.version.outcome == 'success'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          consumer="$RUNNER_TEMP/published-consumer"
          mkdir -p "$consumer"
          npm install --prefix "$consumer" --omit=dev --ignore-scripts --no-audit --no-fund "figjam-context-mcp@$VERSION"
          {
            echo "## Published package: figjam-context-mcp@$VERSION"
            echo
            echo 'Direct production dependencies from a fresh installation:'
            echo '```'
            npm ls --prefix "$consumer" --omit=dev --depth=1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare local and published tarball contents
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP"/{local-pack,published-pack,local-extract,published-extract}
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/local-pack"
          npm pack "figjam-context-mcp@$VERSION" --pack-destination "$RUNNER_TEMP/published-pack"
          tar -xzf "$RUNNER_TEMP/local-pack/figjam-context-mcp-$VERSION.tgz" -C "$RUNNER_TEMP/local-extract"
          tar -xzf "$RUNNER_TEMP/published-pack/figjam-context-mcp-$VERSION.tgz" -C "$RUNNER_TEMP/published-extract"
          diff -r "$RUNNER_TEMP/local-extract" "$RUNNER_TEMP/published-extract"
